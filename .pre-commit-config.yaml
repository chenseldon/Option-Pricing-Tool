# Run on every commit:  pre-commit install
# Run across the repo:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        # The launchers are CRLF on purpose (cmd.exe), so normalise to LF
        # everywhere else rather than letting git rewrite the .bat files.
        args: ["--fix=lf"]
        exclude: '\.(bat|ps1)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: ["pydantic>=2.9", "numpy>=2.0"]
